<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    RewriteRule \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|map|html|php)$ - [L]
    RewriteRule ^ /index.php [L]
</VirtualHost>
