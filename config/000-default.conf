<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteRule \.(js|mjs|css|png|jpg|jpeg|gif|svg|ico|map|html)$ - [L]
    RewriteRule ^ /index.html [L]
</VirtualHost>