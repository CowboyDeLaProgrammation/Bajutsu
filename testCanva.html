<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva</title>
    <style>
        canvas {
            border: solid 1px black;
            width: 100%;
            height: 50%;
        }
    </style>
</head>
<body>
    <canvas id="monCanvas" width="600" height="400"></canvas>
    <script defer>
        const canvas = document.getElementById('monCanvas');
        const ctx = canvas.getContext('2d');

        const gradient = ctx.createLinearGradient(0, 0, 600, 400);
        gradient.addColorStop(0, '#FFE896');
        gradient.addColorStop(1, '#701705');

        const taille = 5;

        for (let x = 0; x < canvas.width; x += taille) {
            for (let y = 0; y < canvas.height; y += taille) {
                // ctx.fillStyle = `hsl(15, 100%, ${Math.floor(Math.random() * 45) + 30}%)`; lave
                // ctx.fillStyle = `hsl(40, 100%, ${Math.floor(Math.random() * 45) + 40}%)`; sable
                ctx.fillStyle = `hsl(205, 100%, ${Math.floor(Math.random() * 45) + 30}%)`; // eau
                ctx.fillRect(x, y, taille, taille);
            }
        }
    </script>
</body>
</html>
